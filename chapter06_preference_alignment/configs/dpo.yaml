version: "1.0"

model:
  base_sft_model: "models/sft_checkpoints/llama3_twin_adapter"
  max_seq_length: 2048
  max_prompt_length: 1024
  load_in_4bit: true

lora:
  r: 64
  lora_alpha: 64
  lora_dropout: 0.0
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

dpo_arguments:
  beta: 0.5
  learning_rate: 0.000002
  lr_scheduler_type: "linear"
  num_train_epochs: 1
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  weight_decay: 0.01
  warmup_steps: 10
  logging_steps: 1
  optim: "adamw_8bit"

curation:
  min_chosen_length: 100
  enforce_punctuation: true

storage:
  raw_data_dir: "data/raw"
  output_dataset_path: "data/artifacts/dpo_dataset/preference_triples.jsonl"
  output_adapter_dir: "models/dpo_checkpoints/llama3_twin_dpo"
